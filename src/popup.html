<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SentinelAI</title>
    <link rel="stylesheet" href="./popup.css">
</head>
<body>
    <h2>SentinelAI</h2>
    <div class="card">
        <h3>Website</h3>
        <p id="website">Loading...</p>
        <h3>Title</h3>
        <p id="title">Loading...</p>
        <h3>Status</h3>
        <p id="status">🟢Ready to Scan</p>
        <button id="scanBtn">Scan Website</button>
        <div id="scanResult">
            <h3>Scan Result</h3>
            <p><strong>Risk Score:</strong> <span id="riskScore">--</span></p>
            <p><strong>Prediction:</strong> <span id="prediction">--</span></p>
            <p><strong>Confidence:</strong> <span id="confidence">--</span></p>
        </div>
    </div>
    <script type="module" src="./popup.ts"></script>

</body>
</html>
